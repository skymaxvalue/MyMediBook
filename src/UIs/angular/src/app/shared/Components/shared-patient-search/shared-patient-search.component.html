<div class="shared-patient-search">
  <div class="patient-search-grid">
    <div class="patient-search-column">
      <div class="field-pair">
        <label for="patientLastNameSearch">Patient Last Name</label>

        <div class="input-with-icon">
          <img src="/assets/images/front-office/images/profile-solid-blue.png" alt="" />
          <input
            type="text"
            id="patientLastNameSearch"
            name="patientLastNameSearch"
            placeholder="Enter last name"
            [(ngModel)]="lastName"
          />
        </div>
      </div>

      <div class="field-pair">
        <label for="patientDobSearch">Date of Birth</label>
        <input type="date" id="patientDobSearch" name="patientDobSearch" [(ngModel)]="dob" />
      </div>
    </div>

    <div class="search-or">
      <span>OR</span>
    </div>

    <div class="patient-search-column">
      <div class="field-pair">
        <label for="patientMobileSearch">Mobile Number</label>

        <div class="input-with-icon">
          <img src="/assets/images/front-office/images/mobile-icon-blue.png" alt="" />
          <input
            type="tel"
            id="patientMobileSearch"
            name="patientMobileSearch"
            placeholder="Enter mobile number"
            inputmode="numeric"
            maxlength="10"
            [(ngModel)]="mobileNo"
          />
        </div>
      </div>

      <div class="search-actions">
        <button type="button" class="btn-outline" (click)="clearSearch()">Clear</button>

        <button
          type="button"
          class="btn-primary search-btn"
          [disabled]="loading === LoadStatus.Loading"
          (click)="searchPatient()"
        >
          <img src="/assets/images/front-office/images/search-white.png" alt="" />
          <span *ngIf="loading === LoadStatus.Loading" class="search-spinner"></span>

          {{ loading === LoadStatus.Loading ? "Searching..." : "Search" }}
        </button>
      </div>
    </div>
  </div>

  <!-- Search results -->
  <div class="patient-search-results" *ngIf="loading === LoadStatus.Loaded">
    <ng-container *ngIf="patients.length > 0; else noPatientsFound">
      <button
        type="button"
        class="patient-result"
        *ngFor="let patient of patients"
        (click)="selectPatient(patient)"
      >
        <div class="patient-result-name">
          <img src="/assets/images/front-office/images/profile-solid-blue.png" alt="" />
          <div class="patient-result-info">
            <small>Patient</small>
            <strong>{{ patient.fullName || "Unnamed patient" }}</strong>
          </div>
        </div>

        <div class="patient-result-details">
          <span class="patient-result-mobile">
            {{ patient.phoneNumber || "No mobile number" }}
          </span>

          <span class="patient-result-dob">
            {{
              patient.dateOfBirth ? (patient.dateOfBirth | date: "dd/MM/yyyy") : "DOB unavailable"
            }}
          </span>
        </div>
      </button>
    </ng-container>

    <ng-template #noPatientsFound>
      <p class="no-patients-message">
        No patients found. Please check your search details and try again.
      </p>
    </ng-template>
  </div>

  <!-- Selected patient -->
  <div class="selected-patient-bar" *ngIf="selectedPatient as patient">
    <div class="selected-patient-main">
      <img src="/assets/images/front-office/images/profile-solid-blue.png" alt="" />
      <div>
        <small>Selected Patient</small>
        <strong>{{ patient.fullName || "—" }}</strong>
      </div>
    </div>

    <div class="selected-patient-phone">
      <img src="/assets/images/front-office/images/mobile-icon-blue.png" alt="" />
      <div>
        <small>Mobile Number</small>
        <strong>{{ patient.phoneNumber || "—" }}</strong>
      </div>
    </div>

    <button type="button" class="btn-switch" (click)="switchPatientProfile()">
      Switch Profile
    </button>
  </div>
</div>
