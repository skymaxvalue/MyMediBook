<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | MyMediBook</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
          rel="stylesheet">
 

            <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="css/forgot-password.css">

          
    <link rel="stylesheet"
          href="css/reset-password.css">

</head>

<body>

<div class="forgot-wrapper">

<div class="forgot-card">


<div class="brand">

<img src="../images/logo.png"
     alt="MyMediBook Logo">

<div class="brand-text">

<span class="black-text">My</span>
<span class="green-text">Medi</span>
<span class="blue-text">Book</span>

</div>

</div>


<h1>Reset Password</h1>

<p class="description">

Create a new secure password for your account.

<br>

Make sure it's strong and easy for you to remember.

</p>


<form id="resetPasswordForm">



<div class="password-field">

<label>

New Password

</label>

<div class="input-box">

<img src="images/lock.png"
     alt="Lock">

<input
type="password"
id="newPassword"
placeholder="Enter new password">

<button
type="button"
class="toggle-password">

<img src="../images/show.png"
     alt="Show Password">

</button>

</div>

</div>



<div class="password-field">

<label>

Confirm New Password

</label>

<div class="input-box">

<img src="images/lock.png"
     alt="Lock">

<input
type="password"
id="confirmPassword"
placeholder="Confirm new password">

<button
type="button"
class="toggle-password">

<img src="../images/show.png"
     alt="Show Password">

</button>

</div>

</div>


<button
type="submit"
class="send-btn">

Reset Password

<img src="images/arrow-right.png"
     alt="Arrow">

</button>


<button
type="button"
class="cancel-link"
id="cancelBtn">

Cancel

</button>

</form>

</div>

</div>

<script src="js/reset-password.js"></script>

</body>

</html>
