<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next in Queue - MyMediBook</title>

    <link rel="stylesheet" href="css/next-in-queue.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="navbar"></div>

    <main class="page-container">

        <div class="breadcrumb">
            <span>Dashboard</span>
            <span class="breadcrumb-separator">»</span>
            <span>Patient Check-In</span>
            <span class="breadcrumb-separator">»</span>
            <span class="current">Next in Queue</span>
        </div>

        <section class="page-header">
            <div>
                <h1>Next in Queue</h1>
                <p>Select a doctor to view their appointment queue.</p>
            </div>
        </section>

        <section class="doctor-selection-card">

            <div class="card-header">
                <h2>Select Doctor</h2>
                <p>Choose a doctor to view today's patient queue.</p>
            </div>

            <div class="form-group">
                <label for="doctorSearch">Doctor Name</label>

                <div class="doctor-select-wrapper">

                    <input
                        type="text"
                        id="doctorSearch"
                        class="doctor-input"
                        placeholder="Search or select doctor"
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        id="doctorDropdownButton"
                        class="dropdown-button"
                        aria-label="Open doctor list"
                    >
                        <span>▼</span>
                    </button>

                    <div id="doctorDropdown" class="doctor-dropdown"></div>

                </div>
            </div>

            <div id="selectedDoctor" class="selected-doctor hidden">
                <div class="selected-doctor-icon">✓</div>

                <div>
                    <span class="selected-label">Selected Doctor</span>
                    <strong id="selectedDoctorName"></strong>
                </div>
            </div>

            <div id="validationMessage" class="validation-message hidden">
                Please select a doctor to continue.
            </div>

            <div class="card-actions">
                <button
                    type="button"
                    id="clearButton"
                    class="secondary-button"
                >
                    Clear
                </button>

                <button
                    type="button"
                    id="viewQueueButton"
                    class="primary-button"
                >
                    View Queue
                </button>
            </div>

        </section>

    </main>

    <div id="footer"></div>

    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/next-in-queue.js"></script>

</body>
</html>
