<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Reset Successful | MyMediBook</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
          rel="stylesheet">


                <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="css/forgot-password.css">

    <link rel="stylesheet"
          href="css/password-reset-success.css">

</head>

<body>

    <div class="forgot-wrapper">

        <div class="forgot-card success-card">

            <div class="brand">

                <img src="../images/logo.png"
                     alt="MyMediBook Logo">

                <div class="brand-text">

                    <span class="black-text">My</span>
                    <span class="green-text">Medi</span>
                    <span class="blue-text">Book</span>

                </div>

            </div>


            <div class="success-animation">

                <span class="confetti dot1"></span>
                <span class="confetti dot2"></span>
                <span class="confetti dot3"></span>
                <span class="confetti dot4"></span>
                <span class="confetti dot5"></span>
                <span class="confetti dot6"></span>
                <span class="confetti dot7"></span>
                <span class="confetti dot8"></span>

                <div class="success-circle">

                    <img src="../images/check.png"
                         alt="Success">

                </div>

            </div>

        

            <h1>Password Changed Successfully!</h1>

            <p class="description">

                Your password has been updated successfully.

                <br>

                You can now login with your new password.

            </p>


            <button type="button"
                    class="send-btn"
                    id="loginBtn">

                Back to Login

                <img src="images/arrow-right.png"
                     alt="Arrow">

            </button>


            <p class="support-text">

                Need help?

                <a href="#">

                    Contact Support

                </a>

            </p>

        </div>

    </div>

    <script src="js/password-reset-success.js"></script>

</body>

</html>
