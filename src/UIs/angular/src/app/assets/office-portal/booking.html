<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Information</title>

<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/booking.css">

</head>

<body>

<div id="navbar-container"></div>

<div class="availability-container">

<div class="patient-info-header">
    <div class="header-title-row">
        <span class="icon-badge">&#128100;</span>
        <h2>Patient Information</h2>
    </div>
    <p>Please provide patient details to continue with the appointment booking.</p>
</div>

<div class="schedule-box">


<form id="bookingForm">

<div class="top-fields">

    <label>Patient Type</label>
    <div class="mobile-radio-group patient-type-group">
        <label class="radio-item">
            <input type="radio" name="patientType" value="existing" checked>
            <span>Select Existing Patient</span>
        </label>
        <label class="radio-item">
            <input type="radio" name="patientType" value="new">
            <span>Add New Patient</span>
        </label>
    </div>

    <label id="patientProfileLabel">Select Patient Profile</label>
    <div class="patient-dropdown" id="patientDropdown">
        <button type="button" class="patient-dropdown-trigger" id="patientDropdownTrigger">
            <span class="patient-avatar-icon">&#128100;</span>
            <span class="patient-dropdown-label" id="patientDropdownLabel">Select Patient</span>
            <span class="chevron">&#9662;</span>
        </button>
        <div class="patient-dropdown-panel" id="patientDropdownPanel">
            <div class="patient-search-box">
                <span class="search-icon">&#128269;</span>
                <input type="text" id="patientSearchInput" placeholder="Search patient...">
            </div>
            <div class="patient-list" id="patientList"></div>
        </div>
    </div>

</div>

<div class="section-header">Patient Details</div>

<div class="detail-grid">

    <div class="field-pair">
        <label for="firstName">First Name <span class="req">*</span></label>
        <input type="text" id="firstName" placeholder="Enter patient first name" required>
    </div>

    <div class="field-pair">
        <label for="lastName">Last Name <span class="req">*</span></label>
        <input type="text" id="lastName" placeholder="Enter patient last name" required>
    </div>

    <div class="field-pair">
        <label for="relation">Select relation with patient <span class="req">*</span></label>
        <select id="relation" required>
            <option value="" disabled selected>Select relation</option>
            <option>Self</option>
            <option>Spouse</option>
            <option>Father</option>
            <option>Mother</option>
            <option>Son</option>
            <option>Daughter</option>
            <option>Sibling</option>
            <option>Other</option>
        </select>
    </div>

    <div class="field-pair empty"></div>

    <div class="field-pair">
        <label for="dateOfBirth">Date Of Birth <span class="req">*</span></label>
        <input type="date" id="dateOfBirth" required>
    </div>

    <div class="field-pair empty"></div>

    <div class="field-pair">
        <label for="age">Age <span class="req">*</span></label>
        <input type="number" id="age" placeholder="Enter age" required>
    </div>

    <div class="field-pair age-type-pair">
        <label class="visually-hidden">Age Type</label>
        <div class="mobile-radio-group age-type-group">
            <label class="radio-item">
                <input type="radio" name="ageType" value="years" required>
                <span>Year(s)</span>
            </label>
            <label class="radio-item">
                <input type="radio" name="ageType" value="months" required>
                <span>Month(s)</span>
            </label>
        </div>
    </div>

    <div class="field-pair">
        <label for="gender">Gender <span class="req">*</span></label>
        <select id="gender" required>
            <option value="" disabled selected>Select patient gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>
    </div>

    <div class="field-pair empty"></div>

</div>

<div class="section-header">Contact Details</div>

<div class="detail-grid">

    <div class="field-pair">
        <label for="address">Primary Address <span class="req">*</span></label>
        <textarea id="address" placeholder="Enter patient address" required></textarea>
    </div>

    <div class="field-pair">
        <label for="phone">Contact Number <span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="Enter contact number" required>
    </div>

    <div class="field-pair">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" placeholder="Enter email address" required>
    </div>

    <div class="field-pair">
        <label for="visitPurpose">Dr. Visit Purpose <span class="req">*</span></label>
        <textarea id="visitPurpose" placeholder="Enter visit purpose / symptoms" required></textarea>
    </div>

    <div class="field-pair">
        <label for="visitType">Type Of Visit <span class="req">*</span></label>
        <select id="visitType" required>
            <option value="" disabled selected>Select type of visit</option>
            <option>Consultation</option>
            <option>Follow-up</option>
        </select>
    </div>

    <div class="field-pair">
        <label>OTP Verification <span class="req">*</span></label>
        <div class="mobile-radio-group otp-method-group">
            <label class="radio-item">
                <input type="radio" name="otp" value="mobile" required>
                <span>Mobile Number</span>
            </label>
            <label class="radio-item">
                <input type="radio" name="otp" value="email" required>
                <span>Email Address</span>
            </label>
        </div>
    </div>

</div>

<div class="form-actions">
<button type="submit" class="book-btn"><span class="btn-icon">&#10003;</span> Confirm</button>
<button type="reset" class="clear-btn" id="clearFormBtn"><span class="btn-icon">&#8635;</span> Clear</button>
</div>

</form>


</div>
</div>


<div id="insuranceModal" class="modal">
<div class="modal-content">
<div class="close-icon" onclick="closeInsuranceModal()">X</div>

<h2>Insurance Details</h2>

<div class="form-grid">

    <label>Provider Name</label>
    <input id="provider" placeholder="Enter Value" required>

    <label>Insurance Policy Id</label>
   <input id="policy" placeholder="Enter Value" required>

    <label>Insurance Group Id</label>
    <input id="groupId" placeholder="Enter Value" required>


    <label>Primary Holder Name</label>
    <input id="holderName" placeholder="Enter Value" required>

    <label>Primary Address</label>
    <input id="insuranceAddress" placeholder="Enter Value" required>


</div>
<div class="form-actions">
<button class="book-btn" onclick="confirmInsurance()">Confirm</button>
<button class="cancel-btn" onclick="closeInsuranceModal()">Cancel</button>
</div>

</div>
</div>


<div id="paymentModal" class="modal">
  <div class="modal-content">

    <div class="close-icon" onclick="closePaymentModal()">X</div>

    <h2 class="modal-title">Payment Details</h2>

    <div class="form-grid">

        <label>Payment Type</label>
        <input id="paymentType" placeholder="Enter Value" required>

        <label>Card Holder Name</label>
        <input id="cardHolder" placeholder="Enter Value" required>

        <label>Card Number</label>
        <input id="cardNumber" placeholder="Enter Value" required>

        <label>Expiry Date</label>
        <div class="inline-row">
            <input id="expiry" placeholder="MM/YY" required>
            <span class="cvv-label">CVV</span>
            <input id="cvv" placeholder="XXX" required>

            

        </div>

    </div>

  
    <div class="form-actions">
        <button onclick="confirmPayment()">Confirm</button>
        <button class="cancel-btn" onclick="closePaymentModal()">Cancel</button>
    </div>

  </div>
</div>








<div id="footer-container"></div>

<script src="js/footer.js"></script>

<script src="js/navbar.js"></script>
<script src="js/booking.js"></script>

</body>
</html>
