<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | My MediBook</title>



    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&display=swap"
          rel="stylesheet">


    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="css/forgot-password.css">

</head>

<body>

<div class="forgot-wrapper">

    <div class="forgot-card">


        <div class="brand">

            <img
                src="../images/logo.png"
                alt="My MediBook Logo">

            <div class="brand-text">

                <span class="black-text">My</span>

                <span class="green-text">Medi</span>

                <span class="blue-text">Book</span>

            </div>

        </div>



    
        <h1>

            Forgot Password

        </h1>

        <p class="description">

            Enter your registered email address or mobile number
            to verify your identity.

            <br><br>

            We'll send you a one-time verification code (OTP).

        </p>


        <form
            id="forgotPasswordForm"
            novalidate>

            <div class="input-box">

                <img
                    src="images/mail.png"
                    alt="Email">

                <input
                    type="text"
                    id="identifier"
                    placeholder="Enter your registered email or mobile number"
                    autocomplete="username"
                    required>

            </div>





            <button
                type="submit"
                class="send-btn">

                <span>

                    Send OTP

                </span>

                <img
                    src="images/arrow-right.png"
                    alt="Arrow">

            </button>


            <div class="login-link">

                <span>

                    Remember your password?

                </span>

                <a href="login.html">

                    Back to Login

                </a>

            </div>

        </form>

    </div>

</div>

<script src="js/forgot-password.js"></script>

</body>

</html>
