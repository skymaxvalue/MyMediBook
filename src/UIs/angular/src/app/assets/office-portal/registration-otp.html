<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OTP Verification | MyMediBook</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
          rel="stylesheet">


          <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="css/forgot-password.css">

    <link rel="stylesheet"
          href="css/forgot-password-otp.css">


</head>

<body>

    <div class="forgot-wrapper">

        <div class="forgot-card">



            <div class="brand">

                <img src="../images/logo.png"
                     alt="MyMediBook Logo">

                <div class="brand-text">

                    <span class="black-text">My</span>
                    <span class="green-text">Medi</span>
                    <span class="blue-text">Book</span>

                </div>

            </div>

            <h1>OTP Verification</h1>

            <p class="description">
                Enter the 4-digit verification code sent to your
                registered email address / mobile number.
            </p>


            <form id="otpForm"
                  autocomplete="off">

                <div class="otp-group">

                    <input type="text"
                           class="otp-input"
                           maxlength="1"
                           inputmode="numeric"
                           autocomplete="one-time-code">

                    <input type="text"
                           class="otp-input"
                           maxlength="1"
                           inputmode="numeric">

                    <input type="text"
                           class="otp-input"
                           maxlength="1"
                           inputmode="numeric">

                    <input type="text"
                           class="otp-input"
                           maxlength="1"
                           inputmode="numeric">

                </div>


                <div class="otp-info">

                    <p class="timer">

                        Remaining time:

                        <span id="countdown">
                            01:00
                        </span>

                    </p>

                    <p class="resend">

                        Didn't receive the code?

                        <button type="button"
                                id="resendBtn">

                            Resend

                        </button>

                    </p>

                </div>


                <button type="submit"
                        class="send-btn">

                    Verify

                    <img src="images/arrow-right.png"
                         alt="Arrow">

                </button>


                <button type="button"
                        class="cancel-btn"
                        id="cancelBtn">

                    Cancel

                </button>

            </form>

           

        </div>

    </div>

    <script src="js/registration-otp.js"></script>

</body>

</html>
