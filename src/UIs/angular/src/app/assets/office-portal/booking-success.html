<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Appointment Confirmed | MyMediBook</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/booking-success.css">
</head>

<body>

<div id="navbar-container"></div>

<main class="success-page">

    <!-- Success state: shown when a completed booking is found -->
    <section class="success-card" id="successCard">

        <div class="status-icon" aria-hidden="true">
            <span class="dot dot-blue dot-1"></span>
            <span class="dot dot-green dot-2"></span>
            <span class="dot dot-gray dot-3"></span>
            <span class="dot dot-blue dot-4"></span>
            <span class="dot dot-green dot-5"></span>
            <span class="dot dot-gray dot-6"></span>
            <div class="status-ring">
                <div class="status-circle">
                    <svg viewBox="0 0 24 24" width="46" height="46" fill="none">
                        <path d="M5 13l4.5 4.5L19 7" stroke="#ffffff" stroke-width="3"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </div>

        <h1>Appointment Booked Successfully!</h1>
        <p class="success-sub" id="successSub">
            Your appointment is confirmed. A summary is below for your records.
        </p>

        <div class="summary-card" id="summaryCard">
            <!-- rows injected by booking-success.js -->
        </div>

        <div class="success-actions">
            <button type="button" class="primary-btn" id="dashboardBtn">
                Back to Dashboard
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                    <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <button type="button" class="secondary-btn" id="bookAnotherBtn">
                Book Another Appointment
            </button>
        </div>

        <p class="support-note">Need help? <a href="#">Contact Support</a></p>

    </section>

    <!-- Empty state: shown when no booking data exists in localStorage -->
    <section class="empty-card" id="emptyCard" hidden>

        <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none">
                <path d="M12 9v4m0 4h.01M10.29 3.86l-8.18 14.18A1.5 1.5 0 0 0 3.34 20.5h17.32a1.5 1.5 0 0 0 1.23-2.46L13.71 3.86a1.5 1.5 0 0 0-2.6 0Z"
                      stroke="#c0752f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1>We couldn't find that appointment</h1>
        <p class="success-sub">
            Your booking details aren't available right now. This can happen if the
            confirmation link expired or the page was opened directly.
        </p>

        <div class="success-actions">
            <button type="button" class="primary-btn" onclick="window.location.href='book-appointment.html'">
                Book an Appointment
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                    <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <button type="button" class="secondary-btn" onclick="window.location.href='dashboard.html'">
                Back to Dashboard
            </button>
        </div>

    </section>

</main>

<div id="footer-container"></div>

<script src="js/footer.js"></script>
<script src="js/navbar.js"></script>
<script src="js/booking-success.js"></script>

</body>
</html>
