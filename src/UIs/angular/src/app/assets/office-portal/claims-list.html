<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Claims | Front Office</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/claims.css">
</head>

<body>

    <div id="navbar-container"></div>

    <main class="dashboard-container cl-page" id="main">

        <nav class="cl-breadcrumb" aria-label="Breadcrumb">
            <ol>
                <li>
                    <a href="dashboard.html" data-route="dashboard">Dashboard</a>
                </li>

                <li>
                    <a href="claims-dashboard.html" data-route="claims">Claims</a>
                </li>

                <li aria-current="page">All Claims</li>
            </ol>
        </nav>

      

        <header class="cl-pagehead">

            <div class="cl-pagehead__main">

                <span class="cl-pagehead__icon">
                    <img src="images/claims.png" alt="" width="28" height="28">
                </span>

                <div>
                    <h1>All Claims</h1>
                    <p>Search, filter, and review all recorded claims.</p>
                </div>

            </div>

            <div class="cl-pagehead__actions">

                <a class="cl-btn cl-btn--ghost" href="claims-dashboard.html">
                    ← Dashboard
                </a>

                <a class="cl-btn cl-btn--primary" href="new-claim.html">
                    + New Claim
                </a>

            </div>

        </header>

        <section class="cl-card" id="allClaimsCard">

            <div class="cl-card__head">

                <div>
                    <h2>Claims Records</h2>
                    <p class="cl-caption" data-live aria-live="polite"></p>
                </div>

            </div>

            <div class="cl-toolbar">

                <label class="cl-field cl-field--search">
                    <span class="cl-search-icon" aria-hidden="true">⌕</span>
                    <span class="cl-sr">Search claims</span>

                    <input
                        type="search"
                        data-search
                        placeholder="Search by Claim ID, patient name, or insurance…"
                    >
                </label>

                <label class="cl-field">
                    <span class="cl-sr">Status</span>
                    <select data-status aria-label="Filter by status"></select>
                </label>

                <label class="cl-field">
                    <span class="cl-sr">Payer</span>
                    <select data-payer aria-label="Filter by payer"></select>
                </label>

                <div class="cl-daterange">

                    <label class="cl-field">
                        <span class="cl-sr">From date</span>
                        <input
                            type="date"
                            data-from
                            aria-label="From service date"
                        >
                    </label>

                    <span class="cl-daterange__sep">–</span>

                    <label class="cl-field">
                        <span class="cl-sr">To date</span>
                        <input
                            type="date"
                            data-to
                            aria-label="To service date"
                        >
                    </label>

                </div>

                <button
                    type="button"
                    class="cl-btn cl-btn--ghost"
                    data-clear
                >
                    Clear Filters
                </button>

            </div>

            <div class="cl-table-region">

                <div class="cl-table-wrap" data-table>

                    <table class="cl-table">

                        <thead>
                            <tr>

                                <th data-key="id">
                                    <button class="cl-sort" type="button">
                                        Claim ID
                                        <span class="cl-sort__ind">↕</span>
                                    </button>
                                </th>

                                <th data-key="patientName">
                                    <button class="cl-sort" type="button">
                                        Patient Name
                                        <span class="cl-sort__ind">↕</span>
                                    </button>
                                </th>

                                <th data-key="payer">
                                    <button class="cl-sort" type="button">
                                        Payer / Insurance
                                        <span class="cl-sort__ind">↕</span>
                                    </button>
                                </th>

                                <th data-key="serviceDate">
                                    <button class="cl-sort" type="button">
                                        Service Date
                                        <span class="cl-sort__ind">↕</span>
                                    </button>
                                </th>

                                <th data-key="amount" class="cl-num">
                                    <button class="cl-sort" type="button">
                                        Claim Amount
                                        <span class="cl-sort__ind">↕</span>
                                    </button>
                                </th>

                                <th data-key="submittedDate">
                                    <button class="cl-sort" type="button">
                                        Submitted Date
                                        <span class="cl-sort__ind">↕</span>
                                    </button>
                                </th>

                                <th data-key="status">
                                    <button class="cl-sort" type="button">
                                        Status
                                        <span class="cl-sort__ind">↕</span>
                                    </button>
                                </th>

                                <th data-key="lastUpdated">
                                    <button class="cl-sort" type="button">
                                        Last Updated
                                        <span class="cl-sort__ind">↕</span>
                                    </button>
                                </th>

                                <th class="cl-actions-col">
                                    Actions
                                </th>

                            </tr>
                        </thead>

                        <tbody data-rows></tbody>

                    </table>

                    <div
                        class="cl-state"
                        data-state
                        hidden
                    ></div>

                </div>

            </div>

            <div class="cl-table-foot">

                <span class="cl-showing" data-info>
                    Loading claims…
                </span>

                <div
                    class="cl-pagination"
                    data-pager
                    aria-label="Claims pagination"
                ></div>

            </div>

        </section>

    </main>

    <div id="footer-container"></div>

    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/claims-demo-data.js"></script>
    <script src="js/claims-data.js"></script>
    <script src="js/claims-ui.js"></script>
    <script src="js/claims-list.js"></script>

</body>

</html>
