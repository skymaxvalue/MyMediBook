<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Verification | My MediBook</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/otp-verification.css">

</head>

<body>

<div class="otp-page">

    <div class="otp-card">


        <div class="brand">

            <img
                src="../images/logo.png"
                alt="My MediBook">

            <div class="brand-text">

                <span class="black-text">My</span>

                <span class="green-text">Medi</span>

                <span class="blue-text">Book</span>

            </div>

        </div>


        <h1 class="otp-title">
            LOGIN VERIFICATION
        </h1>

        <p class="otp-description">
            We've sent a 4-digit verification code to your registered
            mobile number/email. Please enter it below.
        </p>


        <form id="otpForm">

            <div class="otp-group">

                <input
                    type="text"
                    maxlength="1"
                    class="otp-input"
                    autocomplete="one-time-code">

                <input
                    type="text"
                    maxlength="1"
                    class="otp-input">

                <input
                    type="text"
                    maxlength="1"
                    class="otp-input">

                <input
                    type="text"
                    maxlength="1"
                    class="otp-input">

            </div>


            <div class="otp-info">

                <span class="timer">

                    Expires in
                    <strong id="timer">
                        00:54
                    </strong>

                </span>

                <button
                    type="button"
                    id="resendOtp"
                    class="resend-btn">

                    Resend OTP

                </button>

            </div>


            <button
                type="submit"
                class="verify-btn">

                Verify

            </button>

            <button
                type="button"
                class="back-btn"
                onclick="window.location.href='login.html'">

                Cancel

            </button>

        </form>

    </div>

</div>

<script src="js/otp-verification.js"></script>

</body>
</html>
