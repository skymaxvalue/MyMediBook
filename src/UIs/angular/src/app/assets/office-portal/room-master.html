<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Master | Front Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/room-master.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="dashboard-container cl-page" id="main">
    <nav class="cl-breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="dashboard.html">Dashboard</a></li>
        
        <li aria-current="page">Room Master</li>
      </ol>
    </nav>

    <div id="rmNotice" class="rm-notice" role="status" hidden></div>

    <header class="cl-pagehead">
      <div class="cl-pagehead__main">
        <span class="cl-pagehead__icon" aria-hidden="true"><img src="images/ic-bed-blue.png" alt="" width="28" height="28"></span>
        <div>
          <h1>Room Master</h1>
          <p>Facility Management · Room Master</p>
        </div>
      </div>
    </header>

    <section class="cl-card rm-card" aria-labelledby="rmListTitle">
      <div class="cl-card__head">
        <h2 id="rmListTitle">Room List</h2>
        <a class="cl-btn cl-btn--primary" href="new-room.html">+ New Room</a>
      </div>

      <form class="rm-filters" id="rmFilters" role="search">
        <div class="rm-filter"><label for="fltFacility">Facility</label><select id="fltFacility"></select></div>
        <div class="rm-filter"><label for="fltWard">Ward</label><select id="fltWard"></select></div>
        <div class="rm-filter"><label for="fltType">Room Type</label><select id="fltType"></select></div>
        <div class="rm-filter rm-filter--search"><label for="fltSearch">Search by Room No / Name</label><input id="fltSearch" type="search" placeholder="Search…" autocomplete="off"></div>
        <button type="submit" class="rm-btn rm-btn--primary rm-btn--icon" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="rm-btn rm-btn--ghost" id="fltReset">Reset</button>
      </form>

      <div class="cl-table-wrap">
        <table class="cl-table rm-table">
          <thead>
            <tr>
              <th scope="col">Room No</th>
              <th scope="col">Room Name</th>
              <th scope="col">Ward</th>
              <th scope="col">Room Type</th>
              <th scope="col" class="cl-num">Beds</th>
              <th scope="col">Room Status</th>
              <th scope="col">Bed Status</th>
              <th scope="col">Cleaning Status</th>
              <th scope="col">Patient Status</th>
              <th scope="col" class="cl-actions-col">Actions</th>
            </tr>
          </thead>
          <tbody id="rmRows"></tbody>
        </table>
      </div>

      <div class="cl-table-foot">
        <span class="cl-showing" id="rmInfo" aria-live="polite">Loading rooms…</span>
        <div class="cl-pagination" id="rmPager" aria-label="Room list pagination"></div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/room-data.js"></script>
  <script src="js/room-master.js"></script>
</body>
</html>
