<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/messages.css">
</head>
<body>
    <div id="navbar-container"></div>
    


<div class="messages-page">

    <div class="messages-container">

        <div class="messages-header">

            <div class="title-section">

                <div class="messages-icon">
                    <img src="images/message-icon.png" alt="">
                </div>

                <div>
                    <h2>Messages</h2>
                    <p>
                        Stay updated with important notifications and updates
                    </p>
                </div>

            </div>

            <div class="header-actions">

              
      <div class="search-box">

                <img
                    src="images/search-icon.png"
                    alt="Search"
                    class="search-icon"
                >

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search messages..."
                >

</div>

                <select
                    id="filterSelect"
                    class="filter-select">

                    <option value="all">
                        Filter
                    </option>

                    <option value="Medication Reminder">
                        Medication Reminder
                    </option>

                    <option value="Order Update">
                        Order Update
                    </option>

                </select>

            </div>

        </div>

        <div class="message-tabs">

            <button
                class="tab active"
                onclick="switchTab('all')">

                All Messages
                <span id="allCount">0</span>

            </button>

            <button
                class="tab"
                onclick="switchTab('archived')">

                Archived
                <span id="archiveCount">0</span>

            </button>

        </div>

        <div class="table-header">

            <div>Message Date</div>
            <div>Notifications</div>
            <div>Archive</div>
            <div>Prescribed By</div>

        </div>

        <div id="messagesContainer"></div>

    </div>

    <div class="pagination-wrapper">

        <button id="prevBtn">←</button>

        <span id="pageNumber">1</span>

        <button id="nextBtn">→</button>

    </div>

</div>



<div class="delete-modal" id="deleteModal">

    <div class="delete-modal-content">

        <h4>Delete Message</h4>

        <p>
            Are you sure you want to permanently delete this message?
        </p>

        <div class="delete-actions">

            <button
                class="cancel-btn"
                onclick="closeDeleteModal()">

                Cancel

            </button>

            <button
                class="confirm-delete-btn"
                id="confirmDeleteBtn">

                Delete

            </button>

        </div>

    </div>

</div>



    <div id="footer-container"></div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
