<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Front Office Login</title>
<link rel="stylesheet" href="css/front-office-login.css">
</head>
<body>
<div class="split">
<section class="hero">
<div class="overlay">
<div class="hospital-brand">
<img src="images/hospital-logo.png" class="hospital-logo">
<h1>HEALTH HEAVEN<br>MEDICAL CENTER</h1>
<h2>Front Office Portal</h2>
<p>Appointment Check-ins • Walk-in Registration • Patient Queue</p>
</div>
<img src="images/front-office.png" class="hero-image">
<div class="hero-footer"><img src="images/shield.png">Manage patient arrivals efficiently.</div>
</div>
</section>

<section class="login-side">
<header class="top-logos">
<img src="images/mymedibook-logo.png" class="logo">
<img src="images/skymax-logo.png" class="logo">
</header>

<div class="card">
<h1>Front Office Login</h1>
<p>Sign in to manage today's appointments.</p>

<label>Employee ID</label>
<div class="field">
<img src="images/user.png">
<input id="user" placeholder="Enter your username">
</div>

<label>Password</label>
<div class="field">
<img src="images/lock.png">
<input id="password" type="password" placeholder="Enter your password">
<button id="toggle" type="button"><img src="images/eye.png"></button>
</div>

<div class="row">
<label><input type="checkbox"> Remember me</label>
<a href="#">Forgot password?</a>
</div>

<button id="loginBtn" class="login-btn">Sign In</button>

<div class="secure">
<img src="images/shield.png">
<span>Secure Hospital Access</span>
</div>

<hr>

<div class="support">
<strong>Trouble Signing In?</strong><br>
Contact <a href="#">System Support</a>
</div>
</div>
</section>
</div>
<script src="js/front-office-login.js"></script>
</body>
</html>
