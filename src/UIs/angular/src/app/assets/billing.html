```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing</title>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/billing.css">
</head>
<body>

<div id="navbar-container"></div>

<div class="billing-page">

    <div class="billing-container">

        <div class="billing-header">

            <div class="title-section">

                <div class="billing-icon">
                    <img src="images/billing-icon.png" alt="">
                </div>

                <h2>Billing</h2>

            </div>

            <div class="header-actions">

                <div class="search-box">

                <img
                    src="images/search-icon.png"
                    alt="Search"
                    class="search-icon"
                >

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by patient, doctor or clinic..."
                >

</div>

                <select id="sortSelect" class="sort-select">
                    <option value="" selected disabled>Sort By</option>
                    <option value="nameAsc">Patient A-Z</option>
                    <option value="nameDesc">Patient Z-A</option>
                    <option value="newest">Newest Visit</option>
                    <option value="oldest">Oldest Visit</option>
                    
                </select>

            </div>

        </div>

        <div class="table-header">

            <div onclick="sortTable('patient')">
                Patient Name
                <span class="sort-icon">▼</span>
            </div>

            <div onclick="sortTable('visitDate')">
                Visit Date
                <span class="sort-icon">▼</span>
            </div>
            <div>Doctor Name</div>
            <div>Clinic Address</div>
            <div>Total Charge</div>
            <div>Insurance Covered</div>
            <div>Adjustments / Write-Offs</div>
            <div>Patient Responsibility</div>
            <div>Payment Date</div>
            <div>Remaining Balance</div>

        </div>

        <div id="billingContainer"></div>

    </div>

    <div class="pagination-wrapper">

        <button id="prevBtn">←</button>

        <span id="pageNumber">1</span>

        <button id="nextBtn">→</button>

    </div>

</div>

<div id="footer-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/billing.js"></script>

</body>
</html>
```
