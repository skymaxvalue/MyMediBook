<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lab Results</title>

<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/lab-results.css">
</head>

<body>

<div id="navbar-container"></div>

<div class="lab-page">

<div class="lab-container">

<div class="lab-header">

<div class="title-section">

<div class="title-section">

    <div class="lab-icon">
        <img src="images/lab-icon.png" alt="">
    </div>

    <h2>Lab Results</h2>

</div>

</div>

</div>

<div class="top-controls">

<div class="summary-section">

<div class="summary-card total">
<div class="summary-icon"><img src="images/icon-total.png" alt=""></div>
<div>
<h6>Total Tests</h6>
<h3 id="totalTests">0</h3>
<p>All time</p>
</div>
</div>

<div class="summary-card normal">
<div class="summary-icon"><img src="images/icon-normal.png" alt=""></div>
<div>
<h6>Normal</h6>
<h3 id="normalTests">0</h3>
<p>Tests</p>
</div>
</div>

<div class="summary-card critical">
<div class="summary-icon"><img src="images/icon-critical.png" alt=""></div>
<div>
<h6>Critical</h6>
<h3 id="criticalTests">0</h3>
<p>Tests</p>
</div>
</div>

<div class="summary-card pending">
<div class="summary-icon"><img src="images/icon-pending.png" alt=""></div>
<div>
<h6>Pending</h6>
<h3 id="pendingTests">0</h3>
<p>Tests</p>
</div>
</div>

<div class="summary-card reports">
<div class="summary-icon"><img src="images/icon-reports.png" alt=""></div>
<div>
<h6>Reports</h6>
<h3 id="reportsReady">0</h3>
<p>Ready</p>
</div>
</div>

</div>

<div class="header-actions">

<div class="search-box">

    <img
        src="images/search-icon.png"
        alt="Search"
        class="search-icon"
    >

    <input
        type="text"
        id="searchInput"
        placeholder="Search by patient, test or lab..."
    >

</div>

<select id="sortSelect" class="sort-select">

<option value="">Sort By</option>

<option value="nameAsc">Patient A-Z</option>
<option value="nameDesc">Patient Z-A</option>
<option value="newest">Newest Date</option>
<option value="oldest">Oldest Date</option>
<option value="testAsc">Test Name A-Z</option>
<option value="testDesc">Test Name Z-A</option>

</select>

</div>

</div>

<div class="table-header">

    <div onclick="sortResults('patient')">
        Patient Name
        <span class="sort-icon">▼</span>
    </div>

    <div onclick="sortResults('test')">
        Test Name
        <span class="sort-icon">▼</span>
    </div>

    <div>Test Code</div>

    <div onclick="sortResults('date')">
        Date
        <span class="sort-icon">▼</span>
    </div>

    <div>Result Value</div>
    <div>Reference Range</div>
    <div>Status</div>
    <div>Lab Name</div>
    <div>Action</div>

</div>

<div id="labResultsContainer"></div>

</div>

<div class="pagination-wrapper">

<button id="prevBtn">←</button>

<span id="pageNumber">1</span>

<button id="nextBtn">→</button>

</div>

</div>



<div class="modal fade" id="detailsModal">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title">Lab Report Details</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body" id="printArea"></div>

<div class="modal-footer">

<button
class="btn btn-outline-primary"
onclick="downloadPDF()">
Download PDF
</button>

<button
class="btn btn-primary"
onclick="printReport()">
Print Report
</button>

</div>

</div>
</div>
</div>

<div id="footer-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/lab-results.js"></script>

</body>
</html>
