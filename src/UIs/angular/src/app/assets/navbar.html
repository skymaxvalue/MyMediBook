<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/navbar.css">
</head>

<body>

<div class="top-header">

    <div class="left">

        <div class="logo">
            <img src="images/skylogo2.png" alt="SkyMaxValue">

            <div class="logo-text">
                <div class="company-name">
                    SkyMaxValue
                </div>

                <div class="company-subtitle">
                    Technology Solutions
                </div>
            </div>
        </div>

        <p class="date">
            Date:
            <span id="current-date"></span>
        </p>

        <div class="mobile-menu-btn" id="mobileMenuBtn">
            ☰
        </div>

    </div>


    <div class="center">

        <div class="hospital">
             <img class="hospital-icon" src="images/hospital.png" alt="">
            <span>HEALTH HEAVEN <br class="mobile-break"> MEDICAL CENTER</span>
        </div>

        <div class="title">
            Patient Activity Center
        </div>

    </div>


    <div class="right">

        <div class="user-box" id="userBox">

            <div class="user-pill">

                <img
                    src="images/user.png"
                    alt="User"
                    class="user-avatar"
                >

                <span id="username">
                    User Name
                </span>

                <button
                    type="button"
                    class="profile-toggle"
                    id="profileToggle">

                    ▼

                </button>

            </div>

            <div class="dropdown" id="userDropdown">
                <button id="logoutBtn">
                    Logout
                </button>
            </div>

        </div>

    </div>

</div>


<div class="navbar" id="navbar">
    <div class="nav-item" data-page="appointments">My Appointments</div>

    <div class="nav-item" data-page="specialities">Specialities</div>

    <div class="nav-item" data-page="medicine">Medicine Orders</div>

    <div class="nav-item" data-page="lab-results">Lab Results</div>

    <div class="nav-item" data-page="billing">Billing</div>

    <div class="nav-item" data-page="messages">Messages</div>

    <div class="nav-item" data-page="settings">Settings</div>
</div>


<script src="js/navbar.js"></script>
</body>
</html>
