
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicine Orders</title>

    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/medicine-orders.css">
</head>
<body>

<div id="navbar-container"></div>

<div class="medicine-page">

    <div class="medicine-container">

        <div class="medicine-header">

            <div class="title-section">
                <div class="medicine-icon">
                    <img src="images/medicine-icon.png" alt="">
                </div>

                <h2>Medicine Orders</h2>
            </div>

           

        </div>

        
    <div class="top-controls">

    <div class="summary-section">

        <div class="summary-card total">
            <img src="images/orders-icon.png">
            <div>
                <h6>Total</h6>
                <h3 id="totalOrders">0</h3>
                <p>Orders</p>
            </div>
        </div>

        <div class="summary-card ready">
            <img src="images/ready-icon.png">
            <div>
                <h6>Ready</h6>
                <h3 id="readyOrders">0</h3>
                <p>For pickup</p>
            </div>
        </div>

        <div class="summary-card transit">
            <img src="images/transit-icon.png">
            <div>
                <h6>In Transit</h6>
                <h3 id="transitOrders">0</h3>
                <p>On the way</p>
            </div>
        </div>

    </div>
     <div class="header-actions">

                <div class="search-box">
                    <input
                            type="text"
                            id="searchInput"
                            placeholder="Search by medicine or order..."
                    >
                </div>

                <select id="sortSelect" class="sort-select">
                    <option value="" disabled selected>Sort By</option>
                    <option value="nameAsc">Name A-Z</option>
                    <option value="nameDesc">Name Z-A</option>
                    <option value="ready">Ready Orders</option>
                    <option value="transit">In Transit Orders</option>
                    <option value="newest">Newest Order Date</option>
                    <option value="oldest">Oldest Order Date</option>
                </select>

            </div>
            </div>

        <div class="table-header">

            <div>Patient Name</div>
            <div>Medicine Details</div>
            <div>Instructions</div>
            <div>Order Details</div>
            <div>Request Refill</div>
            <div>Pharmacy Information</div>
            <div>Status</div>
            <div>Action</div>

        </div>

        <div id="ordersContainer"></div>

    </div>




    <div class="pagination-wrapper">

        <button id="prevBtn">
            ←
        </button>

        <span id="pageNumber">1</span>

        <button id="nextBtn">
            →
        </button>

    </div>

 

</div>



<div class="modal fade" id="detailsModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Prescription & Order Summary
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body" id="printArea">

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-outline-primary"
                    onclick="downloadPDF()">

                    Download PDF

                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="printDetails()">

                    Print

                </button>

            </div>

        </div>

    </div>

</div>



    <div id="footer-container"></div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/medicine-orders.js"></script>
</body>


</html>
