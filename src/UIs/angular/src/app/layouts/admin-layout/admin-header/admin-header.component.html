<div class="top-header">
    <div class="left">

        <div class="logo">
            <img src="assets/images/skylogo2.png" alt="SkyMaxValue">

            <div class="logo-text">
                <div class="company-name">
                    SkyMaxValue
                </div>

                <div class="company-subtitle">
                    Technology Solutions
                </div>
            </div>
        </div>

        <p class="date">
            Date:
            <span>{{ formattedDate }}</span>
        </p>

        <button class="mobile-menu-btn" (click)="toggleMenu()">
            {{ mobileMenuOpen ? '✕' : '☰' }}
        </button>

    </div>

    <div class="center">

        <div class="hospital">
            <img class="hospital-icon" src="assets/images/hospital.png">

            <span>
                HEALTH HEAVEN
                <br class="mobile-break">
                MEDICAL CENTER
            </span>

        </div>

        <div class="title">
            Admin Working Space
        </div>

    </div>

    <div class="right">

        <div class="user-box">

            <div class="user-pill">

                <img src="assets/images/user.png" class="user-avatar">

                <span id="username">
                    {{username}}
                </span>

                <button class="profile-toggle" (click)="toggleProfile($event)">
                    ▼
                </button>

            </div>

            <div class="dropdown" [class.show]="showProfile">

                <button (click)="logout()">
                    Logout
                </button>

            </div>

        </div>

    </div>
</div>
