<div class="top-header">
  <div class="left">
    <div class="logo">
      <img src="assets/images/skylogo2.png" />
      <span>SkyMaxValue Technology Solutions</span>
    </div>
    <p class="date">
      Date: <span id="current-date"> {{ formattedDate }}</span>
    </p>
  </div>

  <div class="center">
    <div class="hospital">
      <img src="assets/images/hospital.png" />
      HEALTH HEAVEN MEDICAL CENTER
    </div>
    <div class="title">Patient Activity Center</div>
  </div>

  <div class="right">
    <!-- <div class="user-box" id="userBox">
      <div class="user-top">
        <span>User</span>
        <button type="button" class="profile-toggle" id="profileToggle" aria-label="Open account menu">
          <img src="assets/images/user.png" alt="User profile" (click)="showLogout = !showLogout" />
        </button>
      </div>

      <div class="dropdown" id="userDropdown" *ngIf="showLogout">
        <button id="logoutBtn" (click)="logout()">Logout</button>
      </div>

      <div class="user-bottom">Logged In As <b id="username">{{username}}</b></div>
    </div> -->

    <div class="dropdown">
      <button class="btn p-0 border-0 bg-transparent" type="button" data-bs-toggle="dropdown" aria-expanded="false">

        <div class="avatar-wrapper">
          <img src="assets/images/user.png" alt="User" class="user-avatar rounded-circle">

          <span class="status-dot"></span>
        </div>
      </button>

      <div class="dropdown-menu dropdown-menu-end profile-menu shadow border-0">

        <!-- User Info -->
        <div class="profile-header">
          <img src="assets/images/user.png" alt="User" class="profile-avatar rounded-circle">
          <i class="bi bi-chevron-down arrow"></i>

          <div>
            <h6 class="mb-0">{{username}}</h6>
            <small class="text-muted">
              {{user?.data?.email}}
            </small>
            <div class="role-badge">
              Patient
            </div>
          </div>
        </div>

        <div class="dropdown-divider"></div>

        <a class="dropdown-item" routerLink="/dashboard">
          <i class="bi bi-house-door me-2"></i>
          Dashboard
        </a>

        <a class="dropdown-item" routerLink="/profile-update">
          <i class="bi bi-person me-2"></i>
          Profile Update
        </a>

        <a class="dropdown-item" routerLink="/notifications">
          <i class="bi bi-bell me-2"></i>
          Notifications
        </a>

        <a class="dropdown-item" routerLink="/settings">
          <i class="bi bi-gear me-2"></i>
          Settings
        </a>

        <div class="dropdown-divider"></div>

        <a class="dropdown-item" routerLink="/change-password">
          <i class="bi bi-lock me-2"></i>
          Change Password
        </a>

        <a class="dropdown-item text-danger" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i>
          Logout
        </a>

      </div>
    </div>

  </div>
</div>
